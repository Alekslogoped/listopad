<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто спрятался в листьях?</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #222;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-image: url("fon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    touch-action: none;
}

/* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */

.topbar {
    position: absolute;
    z-index: 100;
    top: 15px;
    left: 18px;
    right: 18px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    pointer-events: none;
}

.round {
    padding: 9px 17px;
    border-radius: 18px;

    background: rgba(255,255,255,.92);
    border: 3px solid white;

    color: #65483a;
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 900;

    box-shadow: 0 5px 15px rgba(0,0,0,.18);
}

.progress {
    display: flex;
    gap: 7px;
}

.dot {
    width: 17px;
    height: 17px;

    border-radius: 50%;
    border: 2px solid white;

    background: #d8d2ca;

    box-shadow: 0 2px 5px rgba(0,0,0,.18);
}

.dot.active {
    background: #f39745;
    transform: scale(1.2);
}

.dot.done {
    background: #77c993;
}

/* ---------- ПОДСКАЗКА ---------- */

#hint {
    position: absolute;
    z-index: 90;

    top: 70px;
    left: 50%;

    transform: translateX(-50%);

    padding: 10px 20px;

    background: rgba(255,255,255,.94);
    border: 3px solid #f0a05b;
    border-radius: 22px;

    color: #62483c;

    font-size: clamp(16px, 2vw, 23px);
    font-weight: 900;

    white-space: nowrap;

    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

/* ---------- ГЕРОЙ ---------- */

/* Герой сразу целиком находится под листьями. */
#hero {
 position:absolute; z-index:10; left:50%; top:67%;
 width:min(26vw,300px); height:min(26vw,300px); object-fit:contain;
 transform:translate(-50%,-50%); opacity:1;
 filter:drop-shadow(0 8px 8px rgba(0,0,0,.2)); pointer-events:none;
}

/* ---------- КУЧКА ---------- */

#leafPile {

    position: absolute;

    z-index: 20;

    left: 50%;
    top: 69%;

    transform:
        translate(-50%, -50%);

    width: min(46vw, 560px);
    height: min(31vw, 350px);

    pointer-events: none;
}

/* отдельный лист */

.leaf {

    position: absolute;

    width: clamp(48px, 5.5vw, 82px);
    height: clamp(48px, 5.5vw, 82px);

    object-fit: contain;

    filter:
        drop-shadow(0 4px 3px rgba(0,0,0,.18));

    transition:
        left 1.6s cubic-bezier(.16,.75,.22,1),
        top 1.6s cubic-bezier(.16,.75,.22,1),
        transform 1.7s ease,
        opacity 1.5s ease;
}

/* ---------- МЕТЛА ---------- */

#broom {

    position: absolute;

    z-index: 50;

    right: 4%;
    bottom: 4%;

    width: min(22vw, 280px);
    height: min(37vw, 420px);

    object-fit: contain;

    cursor: grab;

    touch-action: none;

    transform:
        rotate(-10deg);

    transform-origin:
        65% 70%;

    filter:
        drop-shadow(0 9px 7px rgba(0,0,0,.28));
}

#broom.dragging {

    cursor: grabbing;

    transform:
        rotate(-18deg)
        scale(1.04);
}


/* ---------- ДВОРНИК ---------- */

#janitor {
    position: absolute;
    z-index: 35;
    left: 0.5%;
    bottom: 5%;
    width: min(52vw, 650px);
    height: min(82vw, 920px);
    object-fit: contain;
    object-position: left bottom;
    pointer-events: none;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.22));
    transition: transform .35s ease;
}

#janitor.surprised {
    animation: janitorLook .55s ease;
}

#janitor.wow {
    animation: janitorWow .55s ease;
}

@keyframes janitorLook {
    0%   { transform: rotate(0deg) scale(1); }
    35%  { transform: rotate(2deg) scale(1.04); }
    100% { transform: rotate(0deg) scale(1); }
}

@keyframes janitorWow {
    0%   { transform: scale(.92); }
    55%  { transform: scale(1.08); }
    100% { transform: scale(1); }
}

/* ---------- КНОПКА ДАЛЬШЕ ---------- */

#nextContainer {

    position: absolute;

    z-index: 120;

    left: 50%;
    bottom: 5%;

    transform:
        translateX(-50%)
        scale(.7);

    opacity: 0;

    pointer-events: none;

    transition: .4s;
}

#nextContainer.show {

    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);

    pointer-events: auto;
}

#nextButton {

    border: none;

    padding: 14px 34px;

    border-radius: 999px;

    background:
        linear-gradient(#f6a44e,#e77c32);

    color: white;

    font-size:
        clamp(20px,2.5vw,28px);

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 0 #b75c2d;
}

#nextButton:active {

    transform:
        translateY(4px);

    box-shadow:
        0 3px 0 #b75c2d;
}

/* ---------- ВОЛШЕБНЫЕ ИСКРЫ ---------- */

.spark {

    position: absolute;

    z-index: 80;

    pointer-events: none;

    font-size: 35px;

    animation:
        sparkle 1.4s ease-out forwards;
}

@keyframes sparkle {

    0% {
        opacity: 0;
        transform:
            scale(.2)
            rotate(0deg);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-120px)
            scale(1.5)
            rotate(200deg);
    }
}

/* ---------- ФИНАЛ ---------- */

#finish {

    position: absolute;

    z-index: 200;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,245,225,.65);

    backdrop-filter:
        blur(4px);
}

.finishBox {

    padding: 35px;

    width:
        min(650px,90vw);

    text-align: center;

    border-radius: 30px;

    background:
        rgba(255,255,255,.96);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);
}

.finishBox h1 {

    color: #c86632;

    font-size:
        clamp(34px,5vw,58px);
}

.finishBox p {

    color: #5d473c;

    font-size:
        clamp(19px,2.5vw,27px);
}

#again {

    border: none;

    border-radius: 999px;

    padding:
        14px 30px;

    background:
        #ed8b3e;

    color: white;

    font-weight: 900;

    font-size:
        23px;

    cursor: pointer;
}

/* ---------- МОБИЛЬНЫЕ ---------- */

@media(max-width:700px) {

    #hero {

        width: 37vw;
        height: 37vw;

        top: 69%;
    }

    #leafPile {

        width: 58vw;
        height: 39vw;

        top: 72%;
    }

    #janitor {
        width: 58vw;
        height: 91vw;
        left: -1%;
        bottom: 4%;
    }

    #broom {

        width: 30vw;
        height: 45vw;
    }

    #hint {

        top: 58px;

        font-size: 14px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="topbar">

        <div
            class="round"
            id="roundText">
            Раунд 1 из 8
        </div>

        <div
            class="progress"
            id="progress">
        </div>

    </div>

    <div id="hint">
        🧹 Проведи метлой по листьям
    </div>

    <!-- ГЕРОЙ -->

    <img
        id="hero"
        draggable="false">

    <!-- КУЧА ЛИСТЬЕВ -->

    <div id="leafPile"></div>

    <!-- ДВОРНИК СЛЕВА -->
    <img
        id="janitor"
        class="surprised"
        src="janitor/surprised.png"
        alt="Дворник"
        draggable="false">

    <!-- МЕТЛА -->

    <img
        id="broom"
        src="broom.png"
        draggable="false">

    <!-- ДАЛЬШЕ -->

    <div id="nextContainer">

        <button id="nextButton">
            ДАЛЬШЕ →
        </button>

    </div>

    <!-- ФИНАЛ -->

    <div id="finish">

        <div class="finishBox">

            <h1>
                🍂 Молодец!
            </h1>

            <p>
                Ты нашёл всех,
                кто прятался в листьях!
            </p>

            <button id="again">
                ИГРАТЬ ЕЩЁ
            </button>

        </div>

    </div>

</div>

<script>

/* ======================================================
   НАСТРОЙКИ
====================================================== */

const OWNER = "Alekslogoped";
const REPO = "listopad";

const TOTAL_ROUNDS = 8;

/* сколько листьев будет в кучке */

const LEAF_COUNT = 72;

/* ======================================================
   ПЕРЕМЕННЫЕ
====================================================== */

let leaves = [];
let heroes = [];

let currentRound = 0;

let sweepStage = 0;

let dragging = false;

let previousX = 0;

let previousY = 0;

let sweepLock = false;

let audioContext = null;

let noiseBuffer = null;


/* ======================================================
   ЭЛЕМЕНТЫ
====================================================== */

const hero =
    document.getElementById("hero");

const broom =
    document.getElementById("broom");

const janitor =
    document.getElementById("janitor");

const pile =
    document.getElementById("leafPile");

const hint =
    document.getElementById("hint");

const nextContainer =
    document.getElementById("nextContainer");

const roundText =
    document.getElementById("roundText");

const progress =
    document.getElementById("progress");


/* ======================================================
   ЗАГРУЗКА КАРТИНОК ИЗ GITHUB
====================================================== */

async function loadFolder(folder) {

    const url =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Не удалось загрузить папку: " + folder
        );
    }

    const files =
        await response.json();

    return files

        .filter(file =>
            file.type === "file" &&
            /\.(png|jpg|jpeg|webp)$/i.test(file.name)
        )

        .sort((a,b) =>
            a.name.localeCompare(
                b.name,
                undefined,
                {numeric:true}
            )
        )

        .map(file =>
            file.download_url
        );
}


/* ======================================================
   ЗАГРУЖАЕМ ЛИСТЬЯ И ГЕРОЕВ
====================================================== */

async function loadAssets() {

    try {

        leaves =
            await loadFolder("leaves");

        heroes =
            await loadFolder("heroes");

        console.log(
            "Листья:",
            leaves.length
        );

        console.log(
            "Герои:",
            heroes.length
        );

        startRound();

    }

    catch(error) {

        console.error(error);

        hint.innerHTML =
            "Не удалось загрузить картинки";

    }
}


/* ======================================================
   ТОЧКИ РАУНДОВ
====================================================== */

function drawProgress() {

    progress.innerHTML = "";

    for (
        let i = 0;
        i < TOTAL_ROUNDS;
        i++
    ) {

        const dot =
            document.createElement("div");

        dot.className =
            "dot";

        if (i < currentRound)
            dot.classList.add("done");

        if (i === currentRound)
            dot.classList.add("active");

        progress.appendChild(dot);
    }
}


/* ======================================================
   СОЗДАЁМ КУЧКУ
====================================================== */

function createLeafPile() {

    pile.innerHTML = "";

    for (
        let i = 0;
        i < LEAF_COUNT;
        i++
    ) {

        if (!leaves.length)
            return;

        const leaf =
            document.createElement("img");

        leaf.className =
            "leaf";

        leaf.src =
            leaves[
                i % leaves.length
            ];

        /*
        Три группы листьев.

        Группа 0 улетит после первого взмаха.
        Группа 1 после второго.
        Группа 2 после третьего.
        */

        leaf.dataset.group =
            i % 3;

        /*
        Естественная кучка: широкая снизу и уже сверху.
        Не ровный треугольник — добавляем случайность по краям.
        */
        const vertical = Math.random();
        const y = 18 + vertical * 70;

        /* Чем выше лист, тем уже кучка */
        const halfWidth =
            10 + vertical * 38;

        const x =
            50 +
            (Math.random() * 2 - 1) * halfWidth +
            (Math.random() * 6 - 3);

        const rotation =
            Math.random() *
            360;

        const scale =
            .7 +
            Math.random() *
            .55;

        leaf.dataset.x = x;
        leaf.dataset.y = y;

        leaf.style.left =
            x + "%";

        leaf.style.top =
            y + "%";

        leaf.style.transform =
            `translate(-50%,-50%)
             rotate(${rotation}deg)
             scale(${scale})`;

        pile.appendChild(leaf);
    }

    /*
       Небольшая неровная верхушка кучки:
       закрывает верх героя, но не превращает листья в шар.
    */
    for (let i = 0; i < 12; i++) {

        if (!leaves.length) break;

        const leaf = document.createElement("img");
        leaf.className = "leaf";
        leaf.src = leaves[(i + 2) % leaves.length];

        /* Верхушка уходит постепенно на всех трёх взмахах */
        leaf.dataset.group = i % 3;

        const x = 41 + Math.random() * 18;
        const y = 7 + Math.random() * 24;
        const rotation = Math.random() * 360;
        const scale = .85 + Math.random() * .55;

        leaf.dataset.x = x;
        leaf.dataset.y = y;

        leaf.style.left = x + "%";
        leaf.style.top = y + "%";
        leaf.style.zIndex = String(40 + i % 8);
        leaf.style.transform =
            `translate(-50%,-50%) rotate(${rotation}deg) scale(${scale})`;

        pile.appendChild(leaf);
    }
}


/* ======================================================
   НОВЫЙ РАУНД
====================================================== */

function startRound() {

    sweepStage = 0;

    sweepLock = false;

    nextContainer
        .classList
        .remove("show");

    hint.innerHTML =
        "🧹 Проведи метлой по листьям";

    /* В начале каждого раунда дворник удивлён */
    janitor.src = "janitor/surprised.png";
    janitor.className = "surprised";

    roundText.innerHTML =
        `Раунд ${currentRound + 1} из 8`;

    drawProgress();

    /* герой */

    if (heroes[currentRound]) {

        hero.src =
            heroes[currentRound];

        hero.style.display =
            "block";

    }

    else {

        hero.style.display =
            "none";
    }

    createLeafPile();

    resetBroom();
}


/* ======================================================
   МЕТЛА СТАРТУЕТ СПРАВА
====================================================== */

function resetBroom() {

    broom.style.left = "";

    broom.style.top = "";

    broom.style.right =
        "4%";

    broom.style.bottom =
        "4%";
}


/* ======================================================
   ЗВУК ПОДМЕТАНИЯ
====================================================== */

function initAudio() {

    if (audioContext)
        return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const length =
        audioContext.sampleRate *
        1.2;

    noiseBuffer =
        audioContext.createBuffer(
            1,
            length,
            audioContext.sampleRate
        );

    const data =
        noiseBuffer
        .getChannelData(0);

    for (
        let i = 0;
        i < length;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;
    }
}


function playSweepSound() {

    initAudio();

    const source =
        audioContext
        .createBufferSource();

    source.buffer =
        noiseBuffer;

    const filter =
        audioContext
        .createBiquadFilter();

    filter.type =
        "bandpass";

    filter.frequency.value =
        800;

    filter.Q.value =
        .6;

    const gain =
        audioContext
        .createGain();

    const now =
        audioContext.currentTime;

    gain.gain
        .setValueAtTime(
            .001,
            now
        );

    gain.gain
        .exponentialRampToValueAtTime(
            .17,
            now + .06
        );

    gain.gain
        .exponentialRampToValueAtTime(
            .001,
            now + .8
        );

    source
        .connect(filter)
        .connect(gain)
        .connect(
            audioContext.destination
        );

    source.start();

    source.stop(
        now + .85
    );
}


/* ======================================================
   ВОЛШЕБНЫЙ ЗВУК
====================================================== */

function playMagicSound() {

    initAudio();

    const notes =
        [
            523,
            659,
            784,
            1047
        ];

    const now =
        audioContext.currentTime;

    notes.forEach(
        (frequency,index) => {

        const oscillator =
            audioContext
            .createOscillator();

        const gain =
            audioContext
            .createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.value =
            frequency;

        const start =
            now +
            index * .11;

        gain.gain
            .setValueAtTime(
                .001,
                start
            );

        gain.gain
            .exponentialRampToValueAtTime(
                .13,
                start + .04
            );

        gain.gain
            .exponentialRampToValueAtTime(
                .001,
                start + .6
            );

        oscillator
            .connect(gain)
            .connect(
                audioContext.destination
            );

        oscillator.start(start);

        oscillator.stop(
            start + .65
        );
    });
}


/* ======================================================
   РАЗЛЁТ ЛИСТЬЕВ
====================================================== */

function scatterLeaves(stage,direction) {

    const allLeaves =
        document.querySelectorAll(
            ".leaf"
        );

    allLeaves.forEach(
        (leaf,index) => {

        const group =
            Number(
                leaf.dataset.group
            );

        /*
        На каждом взмахе
        улетает новая треть.
        */

        if (
            group !== stage - 1
        )
            return;

        const startX =
            Number(
                leaf.dataset.x
            );

        const startY =
            Number(
                leaf.dataset.y
            );

        /*
        Листья летят преимущественно
        в сторону движения метлы.
        */

        const distance =
            stage === 3
            ? 100 + Math.random()*55
            : 50 + Math.random()*35;

        const newX =
            startX +
            direction *
            distance;

        const newY =
            startY -
            15 +
            Math.random() *
            55;

        const rotation =
            Math.random() *
            900 -
            450;

        leaf.style.left =
            newX + "%";

        leaf.style.top =
            newY + "%";

        leaf.style.transform =
            `translate(-50%,-50%)
             rotate(${rotation}deg)
             scale(.65)`;

        if (stage === 3) {

            setTimeout(() => {

                leaf.style.opacity =
                    "0";

            },300);
        }
    });
}


/* ======================================================
   ОТКРЫВАЕМ ГЕРОЯ
====================================================== */

function revealHero(stage) {
 if(stage===1) hint.innerHTML="🍂 Ой! Кто-то прячется под листьями! Ещё раз!";
 if(stage===2) hint.innerHTML="🍁 Уже лучше видно! Ещё один взмах!";
 if(stage===3){
   hint.innerHTML="✨ Вот кто здесь спрятался!";
   setTimeout(()=>{ playMagicSound(); sparkles(); nextContainer.classList.add("show"); },650);
 }
}


/* ======================================================
   ЗАСЧИТЫВАЕМ ВЗМАХ
====================================================== */

function makeSweep(direction) {

    if (
        sweepLock ||
        sweepStage >= 3
    )
        return;

    sweepLock = true;

    sweepStage++;

    playSweepSound();

    /* Дворник реагирует на каждый взмах */
    janitor.src = "janitor/surprised.png";
    janitor.className = "";
    void janitor.offsetWidth;
    janitor.className = "surprised";

    scatterLeaves(
        sweepStage,
        direction
    );

    revealHero(
        sweepStage
    );

    setTimeout(() => {

        sweepLock = false;

    },850);
}


/* ======================================================
   ПРОВЕРЯЕМ, КАСАЕТСЯ ЛИ МЕТЛА КУЧКИ
====================================================== */

function broomTouchesPile() {

    const broomRect =
        broom
        .getBoundingClientRect();

    const pileRect =
        pile
        .getBoundingClientRect();

    /*
    Берём нижнюю часть метлы,
    где находится сама щётка.
    */

    const x =
        broomRect.left +
        broomRect.width *
        .38;

    const y =
        broomRect.top +
        broomRect.height *
        .72;

    return (

        x > pileRect.left &&

        x < pileRect.right &&

        y > pileRect.top &&

        y < pileRect.bottom
    );
}


/* ======================================================
   ПЕРЕМЕЩЕНИЕ МЕТЛЫ
====================================================== */

function moveBroom(x,y) {

    const gameRect =
        document
        .getElementById("game")
        .getBoundingClientRect();

    const broomRect =
        broom
        .getBoundingClientRect();

    let left =
        x -
        gameRect.left -
        broomRect.width *
        .45;

    let top =
        y -
        gameRect.top -
        broomRect.height *
        .55;

    left =
        Math.max(
            -broomRect.width*.2,
            Math.min(
                gameRect.width -
                broomRect.width*.65,
                left
            )
        );

    top =
        Math.max(
            -broomRect.height*.15,
            Math.min(
                gameRect.height -
                broomRect.height*.7,
                top
            )
        );

    broom.style.left =
        left + "px";

    broom.style.top =
        top + "px";

    broom.style.right =
        "auto";

    broom.style.bottom =
        "auto";
}


/* ======================================================
   УПРАВЛЕНИЕ МЫШЬЮ / ПАЛЬЦЕМ
====================================================== */

broom.addEventListener(
    "pointerdown",
    event => {

    initAudio();

    dragging = true;

    previousX =
        event.clientX;

    previousY =
        event.clientY;

    broom
        .classList
        .add("dragging");

    broom.setPointerCapture?.(
        event.pointerId
    );

    moveBroom(
        event.clientX,
        event.clientY
    );
});


broom.addEventListener(
    "pointermove",
    event => {

    if (!dragging)
        return;

    const dx =
        event.clientX -
        previousX;

    const dy =
        event.clientY -
        previousY;

    const distance =
        Math.hypot(dx,dy);

    moveBroom(
        event.clientX,
        event.clientY
    );

    /*
    Нужно действительно провести
    метлой через листья.
    */

    if (
        distance > 50 &&
        broomTouchesPile()
    ) {

        const direction =
            dx >= 0
            ? 1
            : -1;

        makeSweep(direction);

        previousX =
            event.clientX;

        previousY =
            event.clientY;
    }
});


function stopDragging() {

    dragging = false;

    broom
        .classList
        .remove("dragging");
}


broom.addEventListener(
    "pointerup",
    stopDragging
);

broom.addEventListener(
    "pointercancel",
    stopDragging
);


/* ======================================================
   ИСКРЫ
====================================================== */

function sparkles() {

    const game =
        document
        .getElementById("game");

    const symbols =
        [
            "✨",
            "⭐",
            "✨",
            "🍁"
        ];

    for (
        let i = 0;
        i < 16;
        i++
    ) {

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";

        spark.innerHTML =
            symbols[
                i %
                symbols.length
            ];

        spark.style.left =
            40 +
            Math.random()*20 +
            "%";

        spark.style.top =
            50 +
            Math.random()*20 +
            "%";

        spark.style.animationDelay =
            Math.random()*.3 +
            "s";

        game.appendChild(spark);

        setTimeout(() => {

            spark.remove();

        },1800);
    }
}


/* ======================================================
   СЛЕДУЮЩИЙ РАУНД
====================================================== */

document
.getElementById("nextButton")
.addEventListener(
    "click",
    () => {

    if (
        currentRound <
        TOTAL_ROUNDS - 1
    ) {

        currentRound++;

        startRound();

    }

    else {

        document
        .getElementById("finish")
        .style.display =
        "flex";
    }
});


/* ======================================================
   ИГРАТЬ СНОВА
====================================================== */

document
.getElementById("again")
.addEventListener(
    "click",
    () => {

    currentRound = 0;

    document
        .getElementById("finish")
        .style.display =
        "none";

    startRound();
});
